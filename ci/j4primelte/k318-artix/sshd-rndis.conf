# Diagnostic SSH listener reachable only over the direct USB RNDIS subnet.
Port 22
ListenAddress 172.16.42.1
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key
PidFile /run/j4-rndis-sshd.pid
PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
UsePAM no
AllowUsers alarm
