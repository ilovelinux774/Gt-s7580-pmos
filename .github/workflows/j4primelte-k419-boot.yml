name: J4+ Linux 4.19 Arch Linux ARM BOOT image

on:
  push:
    paths:
      - 'ci/j4primelte/k419/**'
      - 'ci/j4primelte/k510/qcdt.py'
      - 'ci/j4primelte/k510/repack-boot.c'
      - '.github/workflows/j4primelte-k419-boot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j4primelte-k419-boot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      J4_DIR: ci/j4primelte/k419
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Load pinned sources and J4+ boot constraints
        run: |
          set -euo pipefail
          source "$J4_DIR/sources.env"
          for name in RIVA_ANDROID15_KERNEL_URL RIVA_ANDROID15_KERNEL_BRANCH RIVA_ANDROID15_KERNEL_COMMIT \
            RIVA_ANDROID16_KERNEL_URL RIVA_ANDROID16_KERNEL_BRANCH RIVA_ANDROID16_KERNEL_COMMIT \
            RIVA_ANDROID15_DEVICE_URL RIVA_ANDROID15_DEVICE_BRANCH RIVA_ANDROID15_DEVICE_COMMIT \
            RIVA_ANDROID16_DEVICE_URL RIVA_ANDROID16_DEVICE_BRANCH RIVA_ANDROID16_DEVICE_COMMIT \
            RIVA_KERNEL_VERSION J4_DTS_SOURCE_REPO J4_DTS_SOURCE_BRANCH J4_DTS_SOURCE_COMMIT \
            J4_DTS_SOURCE_BOARD J4_BOOT_PARTITION_BYTES J4_BOOT_DONOR_PATH \
            J4_BOOT_DONOR_SHA256 J4_BOOT_PAGE_SIZE J4_DEBUG_SYSTEMD_VERSION \
            ARCHLINUXARM_ROOTFS_URL ARCHLINUXARM_BUILDER_FINGERPRINT \
            ARCHLINUXARM_KEYRING_SHA256 ARCHLINUXARM_ROOT_LABEL \
            ARCHLINUXARM_ROOTFS_IMAGE_MIB J4_ARCH_SYSTEM_PARTITION_BYTES; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Install kernel and initramfs build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev rsync device-tree-compiler \
            gcc gcc-aarch64-linux-gnu libc6-dev python3 dpkg-dev cpio xz-utils \
            curl ca-certificates e2fsprogs gpgv
          sudo update-ca-certificates
          gcc -O2 -Wall -Wextra -Werror -o repack-boot ci/j4primelte/k510/repack-boot.c
          ./repack-boot inspect "$J4_BOOT_DONOR_PATH" >/dev/null

      - name: Fetch pinned Android 16 Riva kernel
        run: |
          set -euo pipefail
          git init --quiet kernel
          git -C kernel remote add origin "$RIVA_ANDROID16_KERNEL_URL"
          git -C kernel fetch --depth=1 origin "$RIVA_ANDROID16_KERNEL_BRANCH"
          git -C kernel checkout --quiet --detach FETCH_HEAD
          actual=$(git -C kernel rev-parse HEAD)
          if [ "$actual" != "$RIVA_ANDROID16_KERNEL_COMMIT" ]; then
            echo "::error title=Riva kernel pin mismatch::expected $RIVA_ANDROID16_KERNEL_COMMIT, got $actual"
            exit 1
          fi
          grep -qx 'VERSION = 4' kernel/Makefile
          grep -qx 'PATCHLEVEL = 19' kernel/Makefile
          grep -qx 'SUBLEVEL = 325' kernel/Makefile
          {
            printf 'kernel_repo=%s\nkernel_branch=%s\nkernel_commit=%s\n' \
              "$RIVA_ANDROID16_KERNEL_URL" "$RIVA_ANDROID16_KERNEL_BRANCH" "$actual"
            printf 'android15_kernel_commit=%s\nandroid15_device_commit=%s\nandroid16_device_commit=%s\n' \
              "$RIVA_ANDROID15_KERNEL_COMMIT" "$RIVA_ANDROID15_DEVICE_COMMIT" "$RIVA_ANDROID16_DEVICE_COMMIT"
            printf 'j4_dts_source=%s@%s:%s\n' "$J4_DTS_SOURCE_REPO" \
              "$J4_DTS_SOURCE_COMMIT" "$J4_DTS_SOURCE_BOARD"
            printf 'donor=%s\ndonor_sha256=%s\nboot_partition_bytes=%s\n' \
              "$J4_BOOT_DONOR_PATH" "$J4_BOOT_DONOR_SHA256" "$J4_BOOT_PARTITION_BYTES"
          } | tee source-report.txt

      - name: Download Ubuntu 22.04 arm64 diagnostic userspace packages
        run: |
          set -euo pipefail
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          test "$codename" = jammy
          aptroot="$PWD/apt-arm64"
          mkdir -p "$aptroot/lists/partial" "$aptroot/archives/partial" "$aptroot/sourceparts" systemd-debs
          : > "$aptroot/status"
          : > "$aptroot/extended_states"
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main universe\n' "$codename" > "$aptroot/sources.list"
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-updates main universe\n' "$codename" >> "$aptroot/sources.list"
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-security main universe\n' "$codename" >> "$aptroot/sources.list"
          apt_opts=(
            -o Dir::State::status="$aptroot/status"
            -o Dir::State::extended_states="$aptroot/extended_states"
            -o Dir::State::lists="$aptroot/lists"
            -o Dir::Cache::archives="$aptroot/archives"
            -o Dir::Etc::sourcelist="$aptroot/sources.list"
            -o Dir::Etc::sourceparts="$aptroot/sourceparts"
            -o APT::Architecture=arm64
            -o APT::Architectures=arm64
          )
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" --download-only --no-install-recommends -y install \
            systemd busybox-static iproute2 util-linux
          cp "$aptroot"/archives/*.deb systemd-debs/
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          records = []
          for package in sorted(Path('systemd-debs').glob('*.deb')):
              get = lambda field: subprocess.check_output(
                  ['dpkg-deb', '-f', str(package), field], text=True).strip()
              records.append((package.name, get('Package'), get('Architecture'), get('Version')))
          systemd = [r for r in records if r[1] == 'systemd' and r[2] == 'arm64']
          if len(systemd) != 1 or not systemd[0][3].startswith('249.'):
              raise SystemExit(f'expected Ubuntu 22.04 arm64 systemd 249, found {systemd}')
          if not any(r[1:3] == ('busybox-static', 'arm64') for r in records):
              raise SystemExit('missing arm64 busybox-static package')
          if not any(r[1:3] == ('iproute2', 'arm64') for r in records):
              raise SystemExit('missing arm64 iproute2 package')
          if not any(r[1:3] == ('util-linux', 'arm64') for r in records):
              raise SystemExit('missing arm64 util-linux package (blkid is needed for root=LABEL)')
          print(f'systemd package pin: {systemd[0][3]}; {len(records)} arm64/all packages')
          PY

      - name: Download and validate Arch Linux ARM rootfs
        run: |
          set -euo pipefail
          bash "$J4_DIR/build-archlinuxarm-rootfs.sh" \
            "$PWD/ArchLinuxARM-aarch64-rootfs.tar.gz"

      - name: Create the labeled Arch rootfs ext4 image
        run: |
          set -euo pipefail
          sudo bash "$J4_DIR/build-rootfs-image.sh" \
            "$PWD/ArchLinuxARM-aarch64-rootfs.tar.gz" "$PWD/rootfs.img" \
            "$ARCHLINUXARM_ROOTFS_IMAGE_MIB"

      - name: Build diagnostic and Arch root-switch initramfs images
        run: |
          set -euo pipefail
          bash "$J4_DIR/build-debug-initramfs.sh" \
            systemd-debs systemd-debug-build systemd-debug-initramfs.cpio.xz
          bash "$J4_DIR/build-rootfs-initramfs.sh" \
            systemd-debs arch-root-initramfs-build arch-root-initramfs.cpio.xz \
            "$ARCHLINUXARM_ROOT_LABEL"
          xz -t systemd-debug-initramfs.cpio.xz
          xz -t arch-root-initramfs.cpio.xz
          sha256sum systemd-debug-initramfs.cpio.xz > initramfs.sha256
          sha256sum arch-root-initramfs.cpio.xz > arch-root-initramfs.sha256

      - name: Build kernel, QCDT and J4+ v0 BOOT image
        run: |
          set -euo pipefail
          export CROSS_COMPILE=aarch64-linux-gnu-
          export JOBS="$(nproc)"
          set +e
          bash "$J4_DIR/build-boot-image.sh" kernel "$PWD/out" \
            "$J4_BOOT_DONOR_PATH" "$PWD/arch-root-initramfs.cpio.xz" \
            2>&1 | tee boot-build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -m 20 -E 'error:|Error [0-9]+|fatal:|FAILED|missing |required Arch|undefined reference|No rule to make' boot-build.log \
              | while IFS= read -r line; do echo "::error title=Linux 4.19 BOOT build failure::$line"; done || true
            while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error title=Linux 4.19 BOOT build log tail::$escaped"
            done < <(tail -n 80 boot-build.log)
            {
              echo '### Linux 4.19 BOOT build failure details'
              echo '```text'
              tail -n 120 boot-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          sha256sum "$J4_DIR/sources.env" "$J4_DIR/import-j4-dts.py" \
            "$J4_DIR/patch-riva-kernel.py" "$J4_DIR/build-boot-image.sh" \
            "$J4_DIR/build-rootfs-initramfs.sh" "$J4_DIR/build-archlinuxarm-rootfs.sh" \
            "$J4_DIR/build-rootfs-image.sh" "$J4_DIR/archlinuxarm.gpg" \
            "$J4_DIR/arch-root-cmdline.py" "$J4_DIR/debug-cmdline.py" \
            > out/port-inputs.sha256
          {
            echo '### J4+ Linux 4.19 Arch Linux ARM BOOT image'
            echo '```text'
            cat out/boot-report.txt
            echo '```'
            echo 'The build validates the image format and size; it does not establish hardware boot success.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface failed kernel build log tail
        if: failure()
        run: |
          set -uo pipefail
          if [ -s boot-build.log ]; then
            tail -n 100 boot-build.log | while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error title=4.19 kernel build log::$escaped"
            done
          else
            echo '::error title=4.19 kernel build log::boot-build.log was not created'
          fi

      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: j4primelte-k419-boot-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            boot-build.log
            systemd-debug-initramfs.cpio.xz
            arch-root-initramfs.cpio.xz
            ArchLinuxARM-aarch64-rootfs.tar.gz
            ArchLinuxARM-aarch64-rootfs.tar.gz.sha256
            ArchLinuxARM-aarch64-rootfs.tar.gz.sig
            ci/j4primelte/k419/archlinuxarm.gpg
            rootfs.img
            rootfs.img.sha256
            out/.config
            out/config.full
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/samsung/msm8917-sec-j4primelte-sea-open-r06.dtb

      - name: Upload J4+ BOOT image and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: j4primelte-k419-arch-boot-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out/j4primelte-k419-arch-boot.img
            out/j4primelte-k419-arch-boot.img.sha256
            out/boot-report.txt
            out/repack-report.txt
            out/donor-report.txt
            out/qcdt-report.txt
            out/arch-root-cmdline.txt
            out/config.full
            out/kernel.payload
            out/j4primelte-rev06.dtb
            out/j4primelte-rev06.qcdt
            out/port-inputs.sha256
            systemd-debug-initramfs.cpio.xz
            initramfs.sha256
            arch-root-initramfs.cpio.xz
            arch-root-initramfs.sha256
            ArchLinuxARM-aarch64-rootfs.tar.gz
            ArchLinuxARM-aarch64-rootfs.tar.gz.sha256
            ArchLinuxARM-aarch64-rootfs.tar.gz.sig
            ci/j4primelte/k419/archlinuxarm.gpg
            rootfs.img
            rootfs.img.sha256
            source-report.txt
            boot-build.log
