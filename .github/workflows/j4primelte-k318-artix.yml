name: J4+ Linux 3.18 Artix/OpenRC ARM experiment

on:
  push:
    paths:
      - '.github/workflows/j4primelte-k318-artix.yml'
      - 'ci/j4primelte/k318-artix/**'
      - 'ci/j4primelte/k419/**'
      - 'ci/j4primelte/k318/**'
      - 'ci/j4primelte/k510/repack-boot.c'
      - 'ci/j4primelte/k510/qcdt.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: j4primelte-k318-artix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    # The AArch64 GCC 4.9 Android prebuilt is a linux-x86 binary, so the kernel
    # must be built on an x86_64 runner. The Arch/OpenRC job below needs a real
    # aarch64 host to run the cross-built openrc-init, so the two are separate.
    name: Build the headless 3.18.120 kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio git ca-certificates \
            libssl-dev libelf-dev libncurses-dev device-tree-compiler python3

      - name: Read the pinned kernel source
        run: |
          set -euo pipefail
          source ci/j4primelte/k318/sources.env
          {
            echo "J4_K318_KERNEL_REPO=$J4_K318_KERNEL_REPO"
            echo "J4_K318_KERNEL_COMMIT=$J4_K318_KERNEL_COMMIT"
            echo "J4_DTB_NAME=msm8917-sec-j4primelte-sea-open-r06.dtb"
          } >> "$GITHUB_ENV"

      - name: Build the headless kernel and the r06 DTB
        run: |
          set -euo pipefail
          git init --quiet k318-tree
          git -C k318-tree remote add origin "$J4_K318_KERNEL_REPO"
          git -C k318-tree fetch --depth=1 origin "$J4_K318_KERNEL_COMMIT"
          git -C k318-tree checkout --quiet --detach FETCH_HEAD
          test "$(git -C k318-tree rev-parse HEAD)" = "$J4_K318_KERNEL_COMMIT"

          git init --quiet k318-toolchain
          git -C k318-toolchain remote add origin \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          git -C k318-toolchain fetch --depth=1 origin \
            5e030eafe024784a73cdf47e6936ac0dbfc763dc
          git -C k318-toolchain checkout --quiet --detach FETCH_HEAD
          chmod +x k318-toolchain/bin/* 2>/dev/null || true

          KERNEL_TREE="$PWD/k318-tree" \
            CROSS_COMPILE="$PWD/k318-toolchain/bin/aarch64-linux-android-" \
            OUT="$PWD/k318-out" JOBS="$(nproc)" \
            bash ci/j4primelte/k318/build.sh 2>&1 | tee k318-kernel-build.log

          cfg=k318-out/.config
          fail=0
          for sym in CONFIG_FB CONFIG_FB_MSM CONFIG_FB_MSM_MDSS CONFIG_MSM_DBA \
                     CONFIG_LCD_CLASS_DEVICE CONFIG_BACKLIGHT_CLASS_DEVICE \
                     CONFIG_TOUCHSCREEN_SEC_INCELL_TS CONFIG_DRM; do
            if grep -qE "^${sym}=y" "$cfg"; then
              echo "::error title=Config::${sym} still enabled"
              fail=1
            fi
          done
          for sym in CONFIG_MEMBARRIER CONFIG_CPUSETS CONFIG_FHANDLE CONFIG_MEMCG \
                     CONFIG_MSM_KGSL CONFIG_RNDIS_IPA CONFIG_EXT4_FS; do
            if ! grep -qE "^${sym}=y" "$cfg"; then
              echo "::error title=Config::${sym} lost"
              fail=1
            fi
          done
          exit "$fail"

      - name: Tar the kernel outputs
        run: |
          set -euo pipefail
          # One tarball with a flat, known layout. Uploading several paths makes
          # upload-artifact preserve their common ancestor, so the files come
          # back nested under k318-out/... - pack our own container instead.
          mkdir -p k318-handoff
          cp k318-out/arch/arm64/boot/Image.gz k318-handoff/Image.gz
          cp "k318-out/arch/arm64/boot/dts/samsung/msm8917/${J4_DTB_NAME}" \
            k318-handoff/"${J4_DTB_NAME}"
          cp k318-out/.config k318-handoff/kernel.config
          cp k318-kernel-build.log k318-handoff/build.log
          (cd k318-handoff && sha256sum Image.gz "${J4_DTB_NAME}" kernel.config > SHA256SUMS)
          tar -C k318-handoff -czf k318-headless-kernel.tar.gz .
          tar -tzf k318-headless-kernel.tar.gz
          sha256sum k318-headless-kernel.tar.gz

      - name: Upload the headless kernel for the packaging job
        uses: actions/upload-artifact@v4
        with:
          name: k318-headless-kernel-${{ github.run_id }}
          path: k318-headless-kernel.tar.gz
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build 3.18.120 Medusa + Artix OpenRC image
    needs: kernel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      K419_DIR: ci/j4primelte/k419
      K318_ARTIX_DIR: ci/j4primelte/k318-artix
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Load pinned J4+ / Arch ARM inputs
        run: |
          set -euo pipefail
          source "$K419_DIR/sources.env"
          source "$K318_ARTIX_DIR/sources.env"
          {
            echo "ARTIX_OPENRC_REPO=$ARTIX_OPENRC_REPO"
            echo "ARTIX_OPENRC_COMMIT=$ARTIX_OPENRC_COMMIT"
            echo "ARTIX_OPENRC_VERSION=$ARTIX_OPENRC_VERSION"
            echo "ARTIX_OPENRC_ARCHIVE_SHA256=$ARTIX_OPENRC_ARCHIVE_SHA256"
            echo "ARCHLINUXARM_ROOTFS_URL=$ARCHLINUXARM_ROOTFS_URL"
            echo "ARCHLINUXARM_BUILDER_FINGERPRINT=$ARCHLINUXARM_BUILDER_FINGERPRINT"
            echo "ARCHLINUXARM_KEYRING_SHA256=$ARCHLINUXARM_KEYRING_SHA256"
            echo "ARCHLINUXARM_ROOT_LABEL=$ARCHLINUXARM_ROOT_LABEL"
            echo "ARCHLINUXARM_ROOTFS_IMAGE_MIB=$ARCHLINUXARM_ROOTFS_IMAGE_MIB"
            echo "J4_ARCH_SYSTEM_PARTITION_BYTES=$J4_ARCH_SYSTEM_PARTITION_BYTES"
            echo "J4_BOOT_PARTITION_BYTES=$J4_BOOT_PARTITION_BYTES"
            echo "MEDUSA_J4_DTB_SHA256=$MEDUSA_J4_DTB_SHA256"
            echo "MEDUSA_KERNEL_PAYLOAD_SHA256=$MEDUSA_KERNEL_PAYLOAD_SHA256"
            echo "MEDUSA_KERNEL_VERSION=$MEDUSA_KERNEL_VERSION"
            echo "MEDUSA_BOOT_PAGE_SIZE=$MEDUSA_BOOT_PAGE_SIZE"
            echo "MEDUSA_BOOT_KERNEL_ADDR=$MEDUSA_BOOT_KERNEL_ADDR"
            echo "MEDUSA_BOOT_RAMDISK_ADDR=$MEDUSA_BOOT_RAMDISK_ADDR"
            echo "MEDUSA_BOOT_SECOND_ADDR=$MEDUSA_BOOT_SECOND_ADDR"
            echo "MEDUSA_BOOT_TAGS_ADDR=$MEDUSA_BOOT_TAGS_ADDR"
          } >> "$GITHUB_ENV"
          test "$(uname -m)" = aarch64

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils build-essential cpio curl device-tree-compiler \
            e2fsprogs file gpgv libcap-dev libmount-dev libncurses-dev \
            libpam0g-dev make pkg-config python3 xz-utils
          gcc -O2 -Wall -Wextra -Werror -o repack-boot "$K419_DIR/../k510/repack-boot.c"
          ./repack-boot inspect boot.img >/dev/null

      - name: Download and authenticate Arch Linux ARM rootfs
        run: |
          set -euo pipefail
          bash "$K419_DIR/build-archlinuxarm-rootfs.sh" \
            "$PWD/ArchLinuxARM-aarch64-rootfs.tar.gz"

      - name: Build the Artix OpenRC AArch64 overlay
        run: |
          set -euo pipefail
          archive="artix-openrc-${ARTIX_OPENRC_COMMIT}.tar.gz"
          curl -fL --retry 3 --max-time 180 \
            -o "$archive" "https://codeload.github.com/artix-linux/openrc/tar.gz/$ARTIX_OPENRC_COMMIT"
          echo "$ARTIX_OPENRC_ARCHIVE_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive"
          source_dir=$(find . -maxdepth 1 -type d -name "openrc-${ARTIX_OPENRC_COMMIT}*" -print -quit)
          test -n "$source_dir"
          bash "$K318_ARTIX_DIR/build-openrc-overlay.sh" "$source_dir" "$PWD/openrc-stage"
          find openrc-stage -type f -name openrc-init -exec sha256sum {} \;

      - name: Create and convert the ARCHROOT ext4 image
        run: |
          set -euo pipefail
          sudo bash "$K419_DIR/build-rootfs-image.sh" \
            "$PWD/ArchLinuxARM-aarch64-rootfs.tar.gz" "$PWD/rootfs.img" \
            "$ARCHLINUXARM_ROOTFS_IMAGE_MIB"
          sudo bash "$K318_ARTIX_DIR/install-openrc-rootfs.sh" \
            "$PWD/rootfs.img" "$PWD/openrc-stage"
          test "$(e2label rootfs.img)" = "$ARCHLINUXARM_ROOT_LABEL"
          stat -c 'OpenRC rootfs image: %n (%s bytes)' rootfs.img
          sha256sum rootfs.img

      - name: Build minimal Arch root-switch initramfs
        run: |
          set -euo pipefail
          build_log="$PWD/initramfs-build.log"
          report_failure() {
            rc=$?
            echo "::error title=initramfs build::failed at: $BASH_COMMAND"
            if [[ -f $build_log ]]; then
              while IFS= read -r line; do
                escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/::/%3A%3A/g; s/\r/%0D/g')
                echo "::error title=initramfs diagnostic::$escaped"
              done < <(tail -n 30 "$build_log")
            fi
            exit "$rc"
          }
          trap report_failure ERR
          mkdir -p initramfs-debs
          (cd initramfs-debs && apt-get download busybox-static:arm64) 2>&1 | tee -a "$build_log"
          dpkg-deb -f initramfs-debs/*.deb Package Architecture Version | tee -a "$build_log"
          bash "$K318_ARTIX_DIR/build-rootfs-initramfs.sh" \
            initramfs-debs initramfs-work arch-root-initramfs.cpio.xz \
            "$ARCHLINUXARM_ROOT_LABEL" 2>&1 | tee -a "$build_log"
          xz -t arch-root-initramfs.cpio.xz
          trap - ERR

      - name: Download the headless kernel from the x86_64 job
        uses: actions/download-artifact@v4
        with:
          name: k318-headless-kernel-${{ github.run_id }}
          path: k318-handoff

      - name: Unpack the kernel and check its checksums
        run: |
          set -euo pipefail
          mkdir -p k318-kernel
          tar -C k318-kernel -xzf k318-handoff/k318-headless-kernel.tar.gz
          (cd k318-kernel && sha256sum -c SHA256SUMS)
          ls -l k318-kernel
          test -s k318-kernel/Image.gz
          # Take the DTB name from the tarball instead of a cross-job variable;
          # the kernel job's GITHUB_ENV does not exist in this job.
          dtb=$(find k318-kernel -maxdepth 1 -name '*.dtb' -print -quit)
          test -n "$dtb" || { echo "::error title=handoff::no DTB in the kernel tarball"; exit 1; }
          echo "J4_DTB_PATH=$dtb" >> "$GITHUB_ENV"

      - name: Package the headless kernel with the Artix root handoff
        run: |
          set -euo pipefail
          build_log="$PWD/k318-headless-package.log"
          report_failure() {
            rc=$?
            echo "::error title=headless BOOT packaging::failed at: $BASH_COMMAND"
            if [[ -f $build_log ]]; then
              while IFS= read -r line; do
                escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/::/%3A%3A/g; s/\r/%0D/g')
                echo "::error title=headless BOOT diagnostic::$escaped"
              done < <(tail -n 30 "$build_log")
            fi
            exit "$rc"
          }
          trap report_failure ERR
          mkdir -p artifacts-out
          dtb="${J4_DTB_PATH:?DTB path missing from the unpack step}"
          bash "$K318_ARTIX_DIR/pack-k318-headless-boot.sh" \
            ./repack-boot k318-kernel/Image.gz "$dtb" \
            arch-root-initramfs.cpio.xz \
            artifacts-out/k318-headless-artix-boot.img 2>&1 | tee -a "$build_log"
          python3 "$K419_DIR/verify-medusa-dtb-boot.py" \
            artifacts-out/k318-headless-artix-boot.img "$dtb" \
            --root-label "$ARCHLINUXARM_ROOT_LABEL" | tee -a "$build_log"
          printf '%s\n' \
            'Kernel: 3.18.120 arm64, CONFIG_FB and the legacy MDSS/panel stack disabled.' \
            'BOOT header: page 2048, kernel 0x80080000, ramdisk 0x83600000, tags 0x83400000' \
            '             (same layout as the Medusa image reported to boot).' \
            'NOT boot-tested on the handset. CI proves packaging only.' \
            > artifacts-out/k318-headless-artix-boot.img.NOT-BOOT-TESTED.txt

      - name: Package the matched Medusa kernel with OpenRC rootfs handoff
        run: |
          set -euo pipefail
          build_log="$PWD/boot-package.log"
          report_failure() {
            rc=$?
            echo "::error title=BOOT packaging::failed at: $BASH_COMMAND"
            if [[ -f $build_log ]]; then
              while IFS= read -r line; do
                escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/::/%3A%3A/g; s/\r/%0D/g')
                echo "::error title=BOOT packaging diagnostic::$escaped"
              done < <(tail -n 30 "$build_log")
            fi
            exit "$rc"
          }
          trap report_failure ERR
          mkdir -p artifacts-out
          bash "$K318_ARTIX_DIR/pack-medusa-openrc-boot.sh" \
            ./repack-boot arch-root-initramfs.cpio.xz artifacts-out/boot.img \
            "$ARCHLINUXARM_ROOT_LABEL" 2>&1 | tee -a "$build_log"
          # Keep the display-fixed J4 pmOS #39 kernel and header layout/addresses,
          # replacing its pmOS ramdisk/cmdline with the Artix root handoff. Do not
          # use the older #37 rollback donor, which stalled before initramfs.
          source "$K318_ARTIX_DIR/sources.env"
          mkdir -p donor
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 \
            -o donor/pmos-j4-39-boot.img "$J4_ARTIX_PMO_DONOR_URL"
          echo "$J4_ARTIX_PMO_DONOR_SHA256  donor/pmos-j4-39-boot.img" | sha256sum -c -
          ./repack-boot inspect donor/pmos-j4-39-boot.img | tee -a "$build_log"
          bash "$K318_ARTIX_DIR/pack-pmos-donor-artix-boot.sh" \
            ./repack-boot donor/pmos-j4-39-boot.img \
            arch-root-initramfs.cpio.xz \
            artifacts-out/pmos-kernel-artix-boot.img \
            "$ARCHLINUXARM_ROOT_LABEL" 2>&1 | tee -a "$build_log"
          # Diagnostic A/B: suppress fbcon binding while keeping the same PMOS
          # kernel, Artix initramfs and rootfs. This tests whether fbcon blocks
          # boot before PID 1; it intentionally leaves no Linux text UI.
          bash "$K318_ARTIX_DIR/pack-pmos-donor-artix-boot.sh" \
            ./repack-boot donor/pmos-j4-39-boot.img \
            arch-root-initramfs.cpio.xz \
            artifacts-out/pmos-kernel-artix-nofbcon-boot.img \
            "$ARCHLINUXARM_ROOT_LABEL" disable-fbcon 2>&1 | tee -a "$build_log"
          # Same A/B image plus initcall_debug, to identify the final kernel
          # initcall if the early driver path stalls again.
          bash "$K318_ARTIX_DIR/pack-pmos-donor-artix-boot.sh" \
            ./repack-boot donor/pmos-j4-39-boot.img \
            arch-root-initramfs.cpio.xz \
            artifacts-out/pmos-kernel-artix-initcall-debug-boot.img \
            "$ARCHLINUXARM_ROOT_LABEL" initcall-debug 2>&1 | tee -a "$build_log"
          sha256sum artifacts-out/boot.img artifacts-out/pmos-kernel-artix-boot.img \
            artifacts-out/k318-headless-artix-boot.img \
            artifacts-out/pmos-kernel-artix-nofbcon-boot.img \
            artifacts-out/pmos-kernel-artix-initcall-debug-boot.img rootfs.img > SHA256SUMS
          cat SHA256SUMS
          {
            echo '### J4+ 3.18.120 + Artix OpenRC experimental image'
            echo
            echo "- Kernel: $MEDUSA_KERNEL_VERSION (matched Medusa payload/DTB)."
            echo "- PID 1: /usr/bin/openrc-init; ext4 root label: $ARCHLINUXARM_ROOT_LABEL."
            echo "- Medusa-kernel BOOT: $(stat -c %s artifacts-out/boot.img) bytes."
            echo "- pmOS-donor-kernel + Artix ramdisk BOOT: $(stat -c %s artifacts-out/pmos-kernel-artix-boot.img) bytes."
            echo "- HEADLESS 3.18.120 kernel (no framebuffer) + Artix ramdisk BOOT: $(stat -c %s artifacts-out/k318-headless-artix-boot.img) bytes."
            echo "- pmOS-donor-kernel + Artix no-fbcon diagnostic: $(stat -c %s artifacts-out/pmos-kernel-artix-nofbcon-boot.img) bytes."
            echo "- pmOS-donor-kernel + initcall-debug diagnostic: $(stat -c %s artifacts-out/pmos-kernel-artix-initcall-debug-boot.img) bytes."
            echo "- Shared rootfs: $(stat -c %s rootfs.img) bytes; label: $ARCHLINUXARM_ROOT_LABEL."
            echo '- The diagnostic images preserve the pinned donor kernel and vary only boot command-line options.'
            echo '- CI proves build/container consistency only; handset boot remains untested.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload standalone BOOT image
        uses: actions/upload-artifact@v4
        with:
          name: j4primelte-318-artix-openrc-boot-${{ github.run_id }}
          path: |
            artifacts-out/boot.img
            artifacts-out/boot.img.sha256
            artifacts-out/boot.img.report.txt
            artifacts-out/boot.img.build-report.txt
            artifacts-out/pmos-kernel-artix-boot.img
            artifacts-out/pmos-kernel-artix-boot.img.sha256
            artifacts-out/k318-headless-artix-boot.img
            artifacts-out/k318-headless-artix-boot.img.sha256
            artifacts-out/k318-headless-artix-boot.img.inspect.txt
            artifacts-out/k318-headless-artix-boot.img.build-report.txt
            artifacts-out/k318-headless-artix-boot.img.NOT-BOOT-TESTED.txt
            artifacts-out/k318-headless-artix-boot.img
            artifacts-out/k318-headless-artix-boot.img.sha256
            artifacts-out/k318-headless-artix-boot.img.inspect.txt
            artifacts-out/k318-headless-artix-boot.img.build-report.txt
            artifacts-out/k318-headless-artix-boot.img.NOT-BOOT-TESTED.txt
            k318-kernel-build.log
            artifacts-out/pmos-kernel-artix-boot.img.report.txt
            artifacts-out/pmos-kernel-artix-boot.img.build-report.txt
            artifacts-out/pmos-kernel-artix-nofbcon-boot.img
            artifacts-out/pmos-kernel-artix-nofbcon-boot.img.sha256
            artifacts-out/pmos-kernel-artix-nofbcon-boot.img.report.txt
            artifacts-out/pmos-kernel-artix-nofbcon-boot.img.build-report.txt
            artifacts-out/pmos-kernel-artix-initcall-debug-boot.img
            artifacts-out/pmos-kernel-artix-initcall-debug-boot.img.sha256
            artifacts-out/pmos-kernel-artix-initcall-debug-boot.img.report.txt
            artifacts-out/pmos-kernel-artix-initcall-debug-boot.img.build-report.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Compress the rootfs for distribution
        run: |
          set -euo pipefail
          # rootfs.img is 2400 MiB, above GitHub's 2 GiB per-release-asset limit,
          # so it has to be compressed. It is almost entirely zero blocks, so a
          # cheap preset already wins: -9 allocates far more memory per thread
          # than the arm runner has and previously got the job killed.
          free -g || true
          df -h . || true
          # Free the space the extracted rootfs tarball and the loose image hold.
          rm -f ArchLinuxARM-aarch64-rootfs.tar.gz
          if ! xz -T1 -6 -k -f rootfs.img; then
            echo "::error title=xz::xz failed; xz exit=$?"
            df -h . || true
            free -m || true
            ls -l rootfs.img || true
            exit 1
          fi
          ls -l rootfs.img rootfs.img.xz
          xz -t rootfs.img.xz
          df -h . || true
          sha256sum rootfs.img rootfs.img.xz | tee rootfs-hashes.txt

      - name: Upload converted rootfs
        uses: actions/upload-artifact@v4
        with:
          name: j4primelte-318-artix-openrc-rootfs-${{ github.run_id }}
          path: |
            rootfs.img.xz
            rootfs-hashes.txt
            rootfs.img.sha256
            SHA256SUMS
            arch-root-initramfs.cpio.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Report disk before the release step
        if: always()
        run: |
          echo "--- free"; free -m || true
          echo "--- df"; df -h . || true
          echo "--- large files"; ls -lSh rootfs.img* arch-root-initramfs.cpio.xz 2>/dev/null || true

      - name: Publish the rootfs as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="j4-rootfs-${GITHUB_RUN_NUMBER}"
          notes="$(cat <<'EOF'
          AArch64 Artix/OpenRC root filesystem for the J4+ 3.18 work, from the
          official Arch Linux ARM rootfs plus the pinned Artix OpenRC overlay.

          Write rootfs.img (xz -d it first) to the /system partition, or to any
          ext4 filesystem labelled ARCHROOT. It is 2400 MiB, 96 MiB smaller than
          the reported 2496 MiB /system; recheck the live partition size before
          writing.

          The initramfs (arch-root-initramfs.cpio.xz) is the matching ramdisk and
          is already inside the BOOT images from this branch; it is here only so
          the pair can be rebuilt.

          NOT boot-tested. Label: ARCHROOT, PID 1: /usr/bin/openrc-init.
          EOF
          )"
          gh release create "$tag" rootfs.img.xz rootfs-hashes.txt \
            arch-root-initramfs.cpio.xz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "J4+ Artix/OpenRC AArch64 rootfs (ARCHROOT, NOT boot-tested)" \
            --notes "$notes"
