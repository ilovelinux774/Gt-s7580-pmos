name: J4+ bring-up (3.18 kernel, ARMtix root)

# Three jobs, because only one of them needs to build a 2.4 GiB filesystem:
#   boot   -- x86_64, no privileges: the BOOT images, immediately uploadable
#   rootfs -- root: the ext4 userspace image, built from ARMtix
#   report -- one summary of what was proven and what was not
#
# Nothing here publishes a release and nothing here flashes a phone.

on:
  workflow_dispatch:
    inputs:
      build_rootfs:
        description: 'Also build the ext4 root filesystem image (slow, ~1 GiB download)'
        type: boolean
        default: true
      artix_image_url:
        description: 'ARMtix rootfs tarball URL (blank = the pinned mirrors). Use when they refuse the runner.'
        type: string
        default: ''
      artix_image_sha256:
        description: 'sha256 of the tarball at artix_image_url (blank = the pin in pins.env)'
        type: string
        default: ''
  push:
    branches:
      - 'arena/**'
    paths:
      - 'ci/j4primelte/**'
      - '.github/workflows/j4primelte.yml'

permissions:
  contents: read

concurrency:
  group: j4primelte-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_TERMINAL_PROMPT: '0'
  PYTHONUNBUFFERED: '1'

jobs:
  boot:
    name: BOOT images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates python3

      - name: Unit tests
        run: |
          set -euo pipefail
          python3 ci/j4primelte/test_j4boot.py
          python3 ci/j4primelte/test_rootswitch.py
          python3 ci/j4primelte/test_pipeline.py
          # As root on purpose: the second half builds a real ext4 image from a
          # tiny synthetic tree (no network, no loop device), so a broken
          # build-rootfs.sh fails here and not after a 1 GiB download.
          sudo python3 ci/j4primelte/test_rootfs.py

      - name: The kernel-floor rule, on real binaries
        run: |
          set -euo pipefail
          # Evidence for the claim this repository now builds on: a binary's
          # .note.ABI-tag is what glibc checks, it is readable without running
          # the binary, and a 3.18 kernel is above glibc's aarch64 minimum of
          # 3.7.0. The check is on this runner's own binaries only -- it proves
          # the reader, not ARMtix; the rootfs job proves ARMtix.
          python3 ci/j4primelte/elfnotes.py /bin/sh /bin/bash | tee artifacts-elf.json
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "ci/j4primelte")
          from elfnotes import floor_exceeds, parse_version
          kernel = parse_version("3.18.120")
          rows = json.load(open("artifacts-elf.json"))
          assert rows, "elfnotes.py printed nothing"
          for row in rows:
              assert row["kind"] == "glibc", row
              assert row["abi_floor"] not in ("unknown", ""), row
              floor = tuple(int(p) for p in row["abi_floor"].split("."))
              assert not floor_exceeds(floor, kernel), row
          print("floor reader ok; no ABI floor above 3.18.120 on this host")
          PY

      - name: Download the reference BOOT image
        run: |
          set -euo pipefail
          source ci/j4primelte/pins.env
          mkdir -p artifacts
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 \
            -o artifacts/reference.img "$J4_REFERENCE_BOOT_URL"
          echo "$J4_REFERENCE_BOOT_SHA256  artifacts/reference.img" | sha256sum -c -

      - name: Inspect the reference image
        run: |
          set -euo pipefail
          python3 ci/j4primelte/j4boot.py inspect artifacts/reference.img --reference \
            | tee artifacts/reference.inspect.json

      - name: Extract the pinned kernel payload and DTB
        run: |
          set -euo pipefail
          python3 ci/j4primelte/extract_payload.py artifacts/reference.img artifacts/payload

      - name: Check the mkinitfs recipe against the real initramfs
        run: |
          set -euo pipefail
          python3 ci/j4primelte/mkinitfs_recipe.py check artifacts/payload/ramdisk.gz \
            --out-dir artifacts/recipe

      - name: Extract the proven pmOS initramfs
        run: |
          set -euo pipefail
          python3 ci/j4primelte/uncpio.py artifacts/payload/ramdisk.gz artifacts/pmos-initramfs
          test -x artifacts/pmos-initramfs/init
          test -L artifacts/pmos-initramfs/bin

      - name: Build the root-switch initramfs
        run: |
          set -euo pipefail
          source ci/j4primelte/pins.env
          python3 ci/j4primelte/make_rootswitch_initramfs.py \
            artifacts/pmos-initramfs artifacts/rootswitch-initramfs.gz \
            --root-label "$ARTIX_ROOT_LABEL"

      - name: Pack the normal BOOT image
        run: |
          set -euo pipefail
          source ci/j4primelte/pins.env
          python3 ci/j4primelte/pack-boot.py \
            --reference artifacts/reference.img \
            --initramfs artifacts/rootswitch-initramfs.gz \
            --out artifacts/boot.img \
            --root-label "$ARTIX_ROOT_LABEL" \
            | tee artifacts/boot.img.pack.log

      - name: Pack the debug BOOT image
        run: |
          set -euo pipefail
          source ci/j4primelte/pins.env
          # Identical payload; only the command line differs. This is the image
          # to flash first: it stops in the proven initramfs shell so a failed
          # root switch is debuggable over USB instead of a black screen.
          python3 ci/j4primelte/pack-boot.py \
            --reference artifacts/reference.img \
            --initramfs artifacts/rootswitch-initramfs.gz \
            --out artifacts/boot-debug.img \
            --root-label "$ARTIX_ROOT_LABEL" \
            --extra-cmdline pmos.debug-shell \
            | tee artifacts/boot-debug.img.pack.log

      - name: Verify both images independently
        run: |
          set -euo pipefail
          source ci/j4primelte/pins.env
          for image in artifacts/boot.img artifacts/boot-debug.img; do
            python3 ci/j4primelte/j4boot.py verify "$image" \
              --expect-kernel-version "$J4_KERNEL_VERSION" \
              --expect-dtb \
              --expect-dtb-sha256 "$J4_DTB_SHA256" \
              --require-cmdline "root=LABEL=$ARTIX_ROOT_LABEL" \
              --require-cmdline "console=ttyMSM0,115200n8" \
              --require-cmdline "console=tty0" \
              --forbid-cmdline "pmos_root_uuid" \
              --forbid-cmdline "pmos_rootfsopts"
          done
          python3 ci/j4primelte/j4boot.py verify artifacts/boot-debug.img \
            --require-cmdline "pmos.debug-shell"
          sha256sum artifacts/boot.img artifacts/boot-debug.img | tee artifacts/SHA256SUMS

      - name: Write the flash instructions
        run: |
          set -euo pipefail
          source ci/j4primelte/pins.env
          {
            echo "J4+ (SM-J415F) BOOT images"
            echo
            echo "Kernel payload and appended DTB are byte-identical to the image"
            echo "that reached the initramfs shell on the phone:"
            echo "  kernel  $J4_KERNEL_PAYLOAD_SHA256"
            echo "  dtb     $J4_DTB_SHA256"
            echo
            echo "Flash ONE of these to BOOT (/dev/mmcblk0p23, 32 MiB) from OrangeFox:"
            echo
            echo "  boot-debug.img  FIRST. Stops in the initramfs debug shell, so the"
            echo "                  root discovery can be read over USB at 172.16.42.1."
            echo "  boot.img        Normal boot: hands over to the $ARTIX_ROOT_LABEL"
            echo "                  filesystem, and to openrc-init inside it."
            echo
            echo "Both expect an ext4 filesystem labelled $ARTIX_ROOT_LABEL on the"
            echo "partition the rootfs image is written to. Without it, the hook logs"
            echo "every device it refused and the boot stays in the initramfs."
            echo
            echo "Neither image writes to any block device."
          } > artifacts/README-FIRST.txt
          cat artifacts/README-FIRST.txt

      - uses: actions/upload-artifact@v4
        with:
          name: j4-boot-${{ github.run_number }}
          path: |
            artifacts/boot.img
            artifacts/boot-debug.img
            artifacts/*.json
            artifacts/*.log
            artifacts/SHA256SUMS
            artifacts/README-FIRST.txt
            artifacts/recipe/*
            artifacts/payload/appended.dtb
            artifacts/payload/inspect.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  rootfs:
    name: Root filesystem image (ARMtix)
    if: inputs.build_rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs curl ca-certificates python3 xz-utils

      - name: Download ARMtix
        env:
          ARTIX_IMAGE_OVERRIDE: ${{ inputs.artix_image_url }}
          ARTIX_SHA_OVERRIDE: ${{ inputs.artix_image_sha256 }}
        run: |
          set -euo pipefail
          source ci/j4primelte/pins.env
          mkdir -p artix
          # The mirrors are tried in order; they are different hosts, not
          # different files. Whatever answers must match the expected hash,
          # which is the pin unless this run overrode it.
          candidates=()
          expected=$ARTIX_IMAGE_SHA256
          if [[ -n ${ARTIX_SHA_OVERRIDE:-} ]]; then
            expected=$ARTIX_SHA_OVERRIDE
            if [[ $expected != "$ARTIX_IMAGE_SHA256" ]]; then
              echo "::warning title=unpinned ARMtix image::expected hash differs from the pin in pins.env; this image is not the pinned one"
            fi
          fi
          if [[ -n ${ARTIX_IMAGE_OVERRIDE:-} ]]; then
            candidates=("$ARTIX_IMAGE_OVERRIDE")
          else
            for mirror in "${ARTIX_IMAGE_MIRRORS[@]}"; do
              candidates+=("${mirror%/}/$ARTIX_IMAGE_FILE")
            done
          fi
          got=''
          for url in "${candidates[@]}"; do
            echo "::group::try $url"
            if curl --fail --location --retry 2 --retry-delay 3 --connect-timeout 20 \
                 --speed-limit 1024 --speed-time 60 \
                 --output artix/armtix.tar.xz "$url"; then
              echo "downloaded from $url"
              got=$url
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "::warning title=ARMtix mirror::${url} did not serve the image; trying the next"
            # Say *why*: a 404 means the file was renamed, a 403/503 means the
            # host is refusing clients, and a TLS failure means the mirror is
            # down. Printed with a browser User-Agent as well, because some
            # mirrors only serve known clients.
            for agent in "curl/8" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"; do
              code=$(curl --silent --location --head --max-time 25 \
                       --user-agent "$agent" --write-out '%{http_code}' \
                       --output /dev/null "$url" 2>/dev/null) || code="(curl failed: $?)"
              echo "  HTTP $code  [$agent]  $url"
            done | sed 's/^/::notice::/'
            rm -f artix/armtix.tar.xz
          done
          if [[ -z $got ]]; then
            echo "::error title=ARMtix image::no mirror served $ARTIX_IMAGE_FILE"
            echo "  tried:"
            printf '    %s\n' "${candidates[@]}"
            echo "The ARMtix hosts are frequently unreachable from CI runners (403,"
            echo "or DNS failure). Either:"
            echo "  * check https://armtix.artixlinux.org/images/ and, if the file was"
            echo "    renamed, update ARTIX_IMAGE_FILE and ARTIX_IMAGE_SHA256 in"
            echo "    ci/j4primelte/pins.env; or"
            echo "  * put the tarball anywhere the runner can reach and dispatch this"
            echo "    workflow with artix_image_url=<url> and artix_image_sha256=<hash>."
            echo "    The hash is still checked, so a copy is as good as the original."
            exit 1
          fi
          ln -sf artix/armtix.tar.xz armtix.tar.xz
          ls -l armtix.tar.xz
          actual=$(sha256sum armtix.tar.xz | cut -d' ' -f1)
          echo "$actual  armtix.tar.xz" | tee artix/armtix.sha256
          echo "$got" > artix/image.url
          # Always verified: an override changes where the bytes come from,
          # never whether they are checked.
          echo "$expected  armtix.tar.xz" | sha256sum -c -
          # Cheap structural check before spending minutes on the build.
          xz --test armtix.tar.xz
          tar -tJf armtix.tar.xz | grep -qxE '(\./)?etc/os-release' || {
            echo "::error title=ARMtix tarball::no /etc/os-release in the archive"
            tar -tJf armtix.tar.xz | head -20
            exit 1
          }

      - name: Build the ext4 root filesystem
        run: |
          set -euo pipefail
          # Job logs are not always readable (artifact storage may be blocked),
          # so every failure has to be visible in the run summary itself.
          report() {
            rc=$?
            if (( rc != 0 )); then
              {
                echo "### Root filesystem build FAILED (rc=$rc)"
                echo
                echo "Disk before/after:"
                echo '```'
                df -h . | tail -2
                echo '```'
                echo "ARMtix tarball: $(stat -c %s armtix.tar.xz 2>/dev/null || echo MISSING) bytes"
                echo "ARMtix URL: $(cat artix/image.url 2>/dev/null || echo unknown)"
                for img in rootfs.img; do
                  [ -e "$img" ] && echo "$img: $(stat -c %s "$img") bytes"
                done
                echo
                echo "Last 60 lines of rootfs-build.log:"
                echo '```'
                tail -60 rootfs-build.log 2>/dev/null || echo "(no log)"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=rootfs build::build-rootfs.sh exited $rc"
              detail=$(tail -12 rootfs-build.log 2>/dev/null | tr '\n' '~' | tr -d '%\r' | cut -c1-3500)
              echo "::error title=rootfs build detail::${detail:-no log captured}"
            fi
            exit "$rc"
          }
          trap report EXIT
          sudo bash -x ci/j4primelte/build-rootfs.sh \
              "$PWD/armtix.tar.xz" "$PWD/rootfs.img" \
            2>&1 | tee rootfs-build.log

      - name: Independent checks on the finished image
        run: |
          set -euo pipefail
          source ci/j4primelte/pins.env
          echo "== filesystem features a 3.18 kernel cannot mount =="
          features=$(dumpe2fs -h rootfs.img 2>/dev/null | sed -n 's/^Filesystem features:[[:space:]]*//p')
          echo "$features"
          for bad in metadata_csum metadata_csum_seed meta_bg orphan_file fast_commit \
                     quota iversion dirdata casefold encrypt bigalloc; do
            if grep -qw "$bad" <<<"$features"; then
              echo "::error title=unsafe ext4 feature::$bad is set; 3.18 will not mount this"
              exit 1
            fi
          done
          echo "== label =="
          label=$(dumpe2fs -h rootfs.img 2>/dev/null | sed -n 's/^Filesystem volume name:[[:space:]]*//p')
          echo "$label"
          test "$label" = "$ARTIX_ROOT_LABEL"
          echo "== size vs the recorded partition =="
          bytes=$(stat -c %s rootfs.img)
          echo "$bytes <= $J4_SYSTEM_PARTITION_BYTES"
          test "$bytes" -le "$J4_SYSTEM_PARTITION_BYTES"
          echo "== init in the image =="
          debugfs -R "stat /usr/bin/openrc-init" rootfs.img 2>/dev/null | head -4 \
            || debugfs -R "stat /sbin/openrc-init" rootfs.img 2>/dev/null | head -4

      - name: Summarise what the image will and will not do
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("rootfs.img.audit.json"))
          kernel = report["kernel"]
          chosen = report["chosen_by_hook"]
          print("### ARMtix image: 3.18 audit\n")
          print(f"- kernel assumed by the audit: **{kernel}**")
          print(f"- ELF files scanned: {report['files_scanned']} "
                f"({report['glibc_files']} glibc, {report['musl_files']} musl, "
                f"{report['static_files']} static)")
          if chosen:
              print(f"- PID 1: `{chosen['resolves_to']}` ({chosen['kind']}), "
                    f"ABI floor **{chosen['abi_floor']}**")
          refused = report["refuses_this_kernel"]
          if refused:
              print(f"- :x: **{len(refused)} files refuse to start on {kernel}**")
              for item in refused[:10]:
                  print(f"  - `{item['path']}` floor {item['abi_floor']}")
          else:
              print(f"- :white_check_mark: no ELF in the image demands a kernel newer than {kernel}")
          if report["unknown_floor_glibc"]:
              print(f"- :warning: {len(report['unknown_floor_glibc'])} glibc files carry no ABI note")
          if report["wrong_arch"]:
              print(f"- :warning: {len(report['wrong_arch'])} files are not {report['arch']}")
          print("\nStill unproven until the phone boots it: that this kernel runs this")
          print("userspace, that the hook finds the labelled filesystem, and that")
          print("openrc-init survives `switch_root`.")
          PY

      - name: Write the rootfs instructions
        run: |
          set -euo pipefail
          source ci/j4primelte/pins.env
          {
            echo "J4+ (SM-J415F) root filesystem -- ARMtix (Artix Linux aarch64), OpenRC"
            echo
            echo "  rootfs.img   raw ext4, label $ARTIX_ROOT_LABEL, $(stat -c %s rootfs.img) bytes"
            echo "  rootfs.img.audit.json   per-file 3.18 compatibility report"
            echo
            echo "This is a bare filesystem, NOT a disk image: write it to a"
            echo "partition, not to /dev/mmcblk0."
            echo
            echo "PID 1 is /usr/bin/openrc-init from ARMtix. glibc here carries an"
            echo "ABI floor of 3.7.0 (Arch Linux ARM does not raise it), which is"
            echo "below this phone's 3.18.120 kernel -- see the audit report, which"
            echo "lists every ELF that would refuse to start."
            echo
            echo "This replaces whatever is on that partition. The postmarketOS"
            echo "install on this phone is NOT touched; nothing here writes BOOT."
          } > rootfs-README.txt
          cat rootfs-README.txt
          sha256sum rootfs.img > rootfs.img.sha256
          cat rootfs.img.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: j4-rootfs-${{ github.run_number }}
          path: |
            rootfs.img
            rootfs.img.sha256
            rootfs.img.audit.json
            rootfs-README.txt
            rootfs-build.log
            artix/armtix.sha256
            artix/image.url
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
