name: Build LK2ND for Galaxy J4+

on:
  push:
    branches:
      - arena/cd201f8f-gt-s7580-pmos
    paths:
      - .github/workflows/j4primelte-lk2nd.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j4primelte-lk2nd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LK2ND build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-arm-none-eabi binutils-arm-none-eabi \
            device-tree-compiler git python3

      - name: Fetch pinned J4+-supporting LK2ND source
        run: |
          set -euo pipefail
          git clone https://github.com/geckyn/lk2nd.git lk2nd-src
          git -C lk2nd-src checkout --detach 7bc82f56d1339b1d081c48ad3c664ec6119257af
          test "$(git -C lk2nd-src rev-parse HEAD)" = 7bc82f56d1339b1d081c48ad3c664ec6119257af
          grep -Fq 'lk2nd,pstore = <0x86100000 0x100000>' \
            lk2nd-src/dts/msm8917-sec-j4primelte-sea-open-r06.dts
          grep -Fq 'lk2nd,match-bootloader = "J415*"' \
            lk2nd-src/dts/msm8917-sec-j4primelte-sea-open-r06.dts
          grep -Fq 'qcom,board-id = <8 6>' \
            lk2nd-src/dts/msm8917-sec-j4primelte-sea-open-r06.dts
          git -C lk2nd-src rev-parse HEAD > lk2nd-source-commit.txt

      - name: Build MSM8917 secondary bootloader
        run: |
          set -euo pipefail
          make -C lk2nd-src TOOLCHAIN_PREFIX=arm-none-eabi- msm8917-secondary \
            2>&1 | tee lk2nd-build.log
          test -s lk2nd-src/build-msm8917-secondary/lk2nd.img
          cp lk2nd-src/build-msm8917-secondary/lk2nd.img lk2nd-j4primelte.img
          sha256sum lk2nd-j4primelte.img > lk2nd-j4primelte.img.sha256
          python3 - <<'PY'
          from pathlib import Path
          import struct

          path = Path('lk2nd-j4primelte.img')
          image = path.read_bytes()
          assert image[:8] == b'ANDROID!', 'output is not an Android boot image'
          page_size = struct.unpack_from('<I', image, 36)[0]
          kernel_size = struct.unpack_from('<I', image, 8)[0]
          ramdisk_size = struct.unpack_from('<I', image, 16)[0]
          dt_size = struct.unpack_from('<I', image, 40)[0]
          assert page_size == 2048, f'unexpected lk2nd image page size {page_size}'
          assert kernel_size > 0 and dt_size > 0, 'LK2ND kernel or QCDT payload is missing'
          assert len(image) <= 32 * 1024 * 1024, f'image too large for J4+ BOOT: {len(image)} bytes'
          print(f'Validated standalone LK2ND image: {len(image)} bytes; page={page_size}; '
                f'kernel={kernel_size}; ramdisk={ramdisk_size}; QCDT={dt_size}')
          PY
          cat lk2nd-j4primelte.img.sha256

      - name: Upload standalone LK2ND image
        uses: actions/upload-artifact@v4
        with:
          name: lk2nd-j4primelte-${{ github.run_id }}
          path: |
            lk2nd-j4primelte.img
            lk2nd-j4primelte.img.sha256
            lk2nd-source-commit.txt
            lk2nd-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
