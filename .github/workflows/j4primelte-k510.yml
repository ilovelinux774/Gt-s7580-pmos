name: j4primelte 5.10 bring-up (systemd-capable kernel)

# What this workflow is, precisely:
#
#   * It builds a Linux **5.10** kernel for the Galaxy J4+ (SM-J415F) from a
#     tree pinned in ci/j4primelte/k510/sources.env, audits the resulting
#     .config against systemd's own requirements, and repacks the kernel into a
#     boot.img using the phone's OWN known-good boot image as the donor.
#     The donor supplies the pmOS initramfs; no rootfs is built here.
#   * It is manual-only (workflow_dispatch). Nothing is published, released or
#     flashed automatically, and a green run means "the image was built and is
#     self-consistent", never "this boots on the phone".
#   * The arm32 vs arm64 question is settled in sources.env: the kernel is
#     arm64 with CONFIG_COMPAT so the existing armv7 pmOS rootfs keeps running.
#     systemd requires kernel >= 5.10 and cgroup v2; neither cares about the
#     kernel's bitness.
#   * Boot images are attached to the run as artifacts with checksums, plus a
#     flash-and-report procedure that works without UART (see REPORTING.md).

on:
  # workflow_dispatch only appears in the Actions UI once this file is on the
  # default branch. Until then, pushes that touch these paths run the build, so
  # the pipeline can be validated on a feature branch.
  push:
    paths:
      - 'ci/j4primelte/k510/**'
      - '.github/workflows/j4primelte-k510.yml'
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig in arch/arm64/configs (empty = discover from the tree)'
        type: string
        default: ''
      kernel_ref:
        description: 'Debug only: override the pinned tree branch (commit pin still enforced unless commit is empty)'
        type: string
        default: ''
      allow_audit_fail:
        description: 'Build even if the systemd config audit fails (still uploads the audit report)'
        type: boolean
        default: false
      dry_run:
        description: 'Only validate the pinned tree (clone, version, probe, defconfigs); no compile'
        type: boolean
        default: true
      kernel_tarball_url:
        description: 'Build from this tarball (e.g. a GitHub release asset made from your local 5.10 tree) instead of the pinned git tree'
        type: string
        default: ''
      kernel_tarball_sha256:
        description: 'Required with kernel_tarball_url: sha256 of that tarball'
        type: string
        default: ''
      require_soc:
        description: 'Reject trees without msm8917/msm8937 board support (turn off only to test generic builds)'
        type: boolean
        default: true
      config_only:
        description: 'Stop after configure + audit (no compile): iterate on the config in a minute'
        type: boolean
        default: false
      selftest_only:
        description: 'Skip the kernel entirely; exercise repack-boot and the audits on the donor image'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: j4-k510-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_TERMINAL_PROMPT: '0'
  PYTHONUNBUFFERED: '1'
  J4_DIR: ci/j4primelte/k510

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this branch (tools only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Load pins
        run: |
          set -euo pipefail
          chmod +x "$J4_DIR"/*.sh
          # First: is sources.env itself sane? A duplicated assignment is
          # invisible to bash's sourcing (last one wins) and cost one run here.
          set +e
          "$J4_DIR/check-pins.sh" "$J4_DIR/sources.env" | tee pins-report.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -E 'PIN FAIL|^  [A-Z_]' pins-report.txt | head -6 | while IFS= read -r l; do
              echo "::error title=Bad pin file::$l"
            done
            exit 1
          fi
          # shellcheck disable=SC1091
          source "$J4_DIR/sources.env"
          {
            echo "KERNEL_URL=$J4_K510_KERNEL_URL"
            echo "KERNEL_BRANCH=${kernel_ref:-}"
            echo "KERNEL_BRANCH=$J4_K510_KERNEL_BRANCH"
            echo "KERNEL_COMMIT=$J4_K510_KERNEL_COMMIT"
            echo "KERNEL_VERSION=$J4_K510_KERNEL_VERSION"
            echo "KERNEL_PROBE=$J4_K510_KERNEL_PROBE"
            echo "TOOLCHAIN_URL=$J4_K510_TOOLCHAIN_URL"
          echo "CROSS_PREFIX=$J4_K510_CROSS_COMPILE"
            echo "TOOLCHAIN_BRANCH=$J4_K510_TOOLCHAIN_BRANCH"
            echo "TOOLCHAIN_COMMIT=$J4_K510_TOOLCHAIN_COMMIT"
            echo "DEFCONFIG=${defconfig:-$J4_K510_DEFCONFIG}"
          # Absolute, because build-kernel.sh runs from the workspace root but
          # takes paths as arguments elsewhere.
          # J4_K510_FRAGMENT may hold several files (space separated, later wins).
          if [ -n "$J4_K510_FRAGMENT" ]; then
            abs=""
            for f in $J4_K510_FRAGMENT; do
              test -f "$f" || { echo "::error title=Pinned fragment missing::$f"; exit 1; }
              abs="$abs $PWD/$f"
            done
            echo "FRAGMENT=$(echo $abs)" >> "$GITHUB_ENV"
          fi
            echo "DONOR_URL=$J4_K510_DONOR_URL"
            echo "DONOR_SHA256=$J4_K510_DONOR_SHA256"
          if [ -n "$J4_K510_BOARD_DTS" ]; then
            test -f "$J4_K510_BOARD_DTS" || { echo "::error title=Board DTS missing::$J4_K510_BOARD_DTS"; exit 1; }
            echo "BOARD_DTS=$PWD/$J4_K510_BOARD_DTS" >> "$GITHUB_ENV"
          fi
          } >> "$GITHUB_ENV"
          # The debug override may pick a different branch, but a commit pin is
          # only meaningful for the branch it came from.
          if [ -n "${{ inputs.kernel_ref }}" ]; then
            echo "KERNEL_BRANCH=${{ inputs.kernel_ref }}" >> "$GITHUB_ENV"
            echo "KERNEL_COMMIT=" >> "$GITHUB_ENV"
            echo "NOTICE: branch overridden to ${{ inputs.kernel_ref }}; commit pin dropped" >&2
          fi
          echo "allow_audit_fail=${{ inputs.allow_audit_fail }}" >> "$GITHUB_ENV"
          if [ "${{ inputs.require_soc }}" = "false" ]; then
            echo "J4_REQUIRE_SOC=0" >> "$GITHUB_ENV"
            echo "NOTICE: SoC support check disabled; a generic tree can pass" >&2
          fi
          # A tarball lets a local (unpublished) 5.10 tree be tested without
          # pushing a multi-gigabyte fork anywhere. It must be pinned by sha256:
          # a kernel built from "whatever that URL holds today" is not testable.
          if [ -n "${{ inputs.kernel_tarball_url }}" ]; then
            if [ -z "${{ inputs.kernel_tarball_sha256 }}" ]; then
              echo "kernel_tarball_url requires kernel_tarball_sha256" >&2
              exit 1
            fi
            echo "KERNEL_TARBALL_URL=${{ inputs.kernel_tarball_url }}" >> "$GITHUB_ENV"
            echo "KERNEL_TARBALL_SHA256=${{ inputs.kernel_tarball_sha256 }}" >> "$GITHUB_ENV"
            echo "NOTICE: building from tarball, git pins do not apply" >&2
          fi
          # A dispatch honours its dry_run input; a push builds for real, which
          # is the only way to get a boot image out of a branch that is not the
          # default branch yet.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dry="${{ inputs.dry_run }}"
          else
            dry=false
          fi
          echo "J4_DRY_RUN=$dry" >> "$GITHUB_ENV"
          echo "dry run: $dry"

      - name: Build host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev rsync zip unzip xz-utils cpio \
            device-tree-compiler gcc libc6-dev python3 gcc-aarch64-linux-gnu
          gcc -O2 -Wall -Wextra -Werror -o repack-boot "$J4_DIR/repack-boot.c"
          ./repack-boot inspect "$J4_DIR/../../boot.img" >/dev/null 2>&1 || true
          echo "repack-boot built"

      - name: Self-test QCDT and appended-FDT boot-image layouts
        run: |
          set -euo pipefail
          # Keep these tests independent of a real kernel and donor: prove the
          # QCDT v3 metadata, Qualcomm dt_size field, and post-ramdisk placement.
          python3 "$J4_DIR/test_qcdt.py" --fixture-out /tmp/test-qcdt.img \
            | tee selftest-report.txt
          head -c 65536 /dev/urandom > /tmp/fake-kernel
          head -c 32768 /dev/urandom > /tmp/fake-ramdisk
          ./repack-boot build --kernel /tmp/fake-kernel --ramdisk /tmp/fake-ramdisk \
            --out /tmp/synth.img --page-size 4096 --kernel-addr 0x82008000 \
            --ramdisk-addr 0x83000000 --tags-addr 0x82000100 \
            --second-addr 0x82f00000 --cmdline 'selftest'
          ./repack-boot inspect /tmp/synth.img | tee -a selftest-report.txt
          ./repack-boot repack /tmp/synth.img --kernel-new /tmp/fake-kernel \
            --dt /tmp/test-qcdt.img --out /tmp/synth-qcdt.img \
            | tee -a selftest-report.txt
          ./repack-boot inspect /tmp/synth-qcdt.img | tee -a selftest-report.txt
          grep -q 'qcdt.*v3, 3 match records' selftest-report.txt
          # The provided Project Medusa J4+ image uses a different handoff:
          # raw FDTs are included in kernel_size and dt_size stays zero. Test
          # that legacy layout independently, without replacing the QCDT path.
          PYTHONPATH="$J4_DIR" python3 - <<'PY'
          from pathlib import Path
          from test_qcdt import fixture_dtb
          Path('/tmp/fake-board.dtb').write_bytes(fixture_dtb())
          PY
          ./repack-boot repack /tmp/synth.img --kernel-new /tmp/fake-kernel \
            --append-dtb /tmp/fake-board.dtb --out /tmp/synth-appended-dtb.img \
            | tee -a selftest-report.txt
          ./repack-boot inspect /tmp/synth-appended-dtb.img | tee -a selftest-report.txt
          python3 - <<'PY' | tee -a selftest-report.txt
          from pathlib import Path
          import struct
          image = Path('/tmp/synth-appended-dtb.img').read_bytes()
          page, kernel_size, dt_size = (struct.unpack_from('<I', image, off)[0]
                                        for off in (36, 8, 40))
          dtb = Path('/tmp/fake-board.dtb').read_bytes()
          kernel = image[page:page + kernel_size]
          assert dt_size == 0, f'expected dt_size=0, got {dt_size}'
          assert kernel.endswith(dtb), 'FDT is not at the end of kernel payload'
          print(f'raw appended FDT: {len(dtb)} bytes inside kernel; dt_size=0')
          PY
          # Refusals must stay refusals.
          if ./repack-boot build --kernel /tmp/fake-kernel --ramdisk /tmp/fake-ramdisk \
               --out /tmp/synth.img 2>/dev/null; then
            echo "::error title=Self-test::build overwrote an existing image without --force"
            exit 1
          fi
          if ./repack-boot repack /tmp/synth.img --kernel-new /tmp/nonexistent \
               --out /tmp/synth3.img 2>/dev/null; then
            echo "::error title=Self-test::repack accepted a missing kernel"
            exit 1
          fi
          echo "QCDT/boot-image self-test passed"

      - name: Self-test only (skips kernel, donor and repack)
        if: ${{ inputs.selftest_only }}
        run: |
          echo "selftest_only requested; stopping before the kernel build"
          {
            echo '## J4+ 5.10 bring-up: self-test only'
            echo
            echo 'repack-boot build/inspect/repack and the refusal paths passed.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Obtain the kernel tree (git pin or pinned tarball)
        run: |
          set -euo pipefail
          mkdir -p kernel
          if [ -n "${KERNEL_TARBALL_URL:-}" ]; then
            echo "source: tarball"
            curl -fL --retry 3 --retry-delay 5 -o /tmp/kernel.tar "$KERNEL_TARBALL_URL"
            echo "$KERNEL_TARBALL_SHA256  /tmp/kernel.tar" | sha256sum -c -
            tar -xf /tmp/kernel.tar -C kernel --strip-components=1
            head=$(git -C kernel rev-parse HEAD 2>/dev/null || true)
            echo "tarball HEAD (if it carries .git): ${head:-none}"
          else
            echo "source: git"
            git init --quiet kernel
            git -C kernel remote add origin "$KERNEL_URL"
            git -C kernel fetch --depth=1 origin "$KERNEL_BRANCH"
            git -C kernel checkout --quiet --detach FETCH_HEAD
            if [ -n "$KERNEL_COMMIT" ]; then
              head=$(git -C kernel rev-parse HEAD)
              if [ "$head" != "$KERNEL_COMMIT" ]; then
                echo "::error title=Pin mismatch::tree HEAD $head but sources.env pins $KERNEL_COMMIT. Either the branch moved (update the pin deliberately) or this is the wrong tree."
                exit 1
              fi
              echo "commit pin verified: $head"
            else
              echo "no commit pin: building $(git -C kernel rev-parse HEAD) on $KERNEL_BRANCH"
            fi
          fi

      - name: Validate the tree before spending an hour on it
        run: |
          set -euo pipefail
          chmod +x "$J4_DIR"/*.sh
          set +e
          J4_REQUIRE_SOC="${J4_REQUIRE_SOC:-1}" \
            "$J4_DIR/verify-tree.sh" kernel "$KERNEL_VERSION" "$KERNEL_PROBE" "$DEFCONFIG" 2>&1 \
            | tee tree-report.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # Put the reason on the run itself, so it is readable without
            # downloading a log or an artifact.
            matched=0
            while IFS= read -r line; do
              echo "::error title=Tree rejected::$line"
              matched=1
            done < <(grep -E 'VERIFY FAIL|VERDICT|^ +Point|no board defconfig|ambiguous' tree-report.txt | head -5)
            if [ "$matched" -eq 0 ]; then
              # An unexplained non-zero exit used to leave nothing readable.
              # Say so, with the last lines of the report, rather than failing
              # with no annotation at all.
              tail -n 8 tree-report.txt | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=Tree check failed (rc=$rc)::$line"
              done
            fi
            exit 1
          fi

      - name: Audit the config fragment against the tree
        run: |
          set -euo pipefail
          if [ -z "${FRAGMENT:-}" ]; then
            echo "no fragment pinned"; exit 0
          fi
          set +e
          python3 "$J4_DIR/fragment-audit.py" kernel $FRAGMENT 2>&1 | tee fragment-report.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -E 'not in this tree|cannot parse' fragment-report.txt | head -5 | while IFS= read -r l; do
              echo "::error title=Fragment symbol missing::$l"
            done
            exit 1
          fi

      - name: Decide the defconfig
        run: |
          set -euo pipefail
          if [ -n "$DEFCONFIG" ]; then
            echo "using pinned defconfig: $DEFCONFIG"
          else
            found=$(find kernel/arch/arm64/configs -type f \
              \( -iname '*j4*' -o -iname '*scuba*' -o -iname '*khaje*' \
                 -o -iname '*msm8917*' -o -iname '*msm8937*' -o -iname '*sdm429*' \) \
              -printf '%P\n' | sort)
            count=$(printf '%s\n' "$found" | grep -c . || true)
            if [ "$count" -ne 1 ]; then
              echo "Cannot pick a defconfig: found $count candidates." >&2
              printf '%s\n' "$found" >&2
              echo "Set the 'defconfig' input and pin it in sources.env." >&2
              exit 1
            fi
            echo "DEFCONFIG=$found" >> "$GITHUB_ENV"
            echo "discovered defconfig: $found"
          fi

      - name: Fetch toolchain
        if: env.J4_DRY_RUN != 'true'
        run: |
          set -euo pipefail
          if [ -z "$TOOLCHAIN_URL" ]; then
            # Host compiler (installed with the host tools above).
            "$CROSS_PREFIX"gcc -dumpmachine | grep -q aarch64 \
              || { echo "::error title=Toolchain::host ${CROSS_PREFIX}gcc is not aarch64"; exit 1; }
            echo "${CROSS_PREFIX:-aarch64-linux-gnu-}gcc $("$CROSS_PREFIX"gcc -dumpversion)"
            echo "using host toolchain"
            exit 0
          fi
          git init --quiet tc
          git -C tc remote add origin "$TOOLCHAIN_URL"
          git -C tc fetch --depth=1 origin "$TOOLCHAIN_BRANCH"
          git -C tc checkout --quiet --detach FETCH_HEAD
          if [ -n "$TOOLCHAIN_COMMIT" ] && [ "$(git -C tc rev-parse HEAD)" != "$TOOLCHAIN_COMMIT" ]; then
            echo "toolchain pin mismatch" >&2
            exit 1
          fi
          chmod +x tc/bin/* 2>/dev/null || true
          ./tc/bin/"${CROSS_PREFIX:-aarch64-linux-gnu-}"gcc -dumpmachine | tee /dev/stderr | grep -q aarch64 \
            || { echo "toolchain is not aarch64" >&2; exit 1; }

      - name: Build the required board DTB and Qualcomm QCDT image
        run: |
          set -euo pipefail
          if [ -z "${BOARD_DTS:-}" ]; then
            echo "::error title=Missing board DTS::a flashable J4+ image requires its board DTB"
            exit 1
          fi
          mkdir -p board-dtb
          cpp -nostdinc -undef -x assembler-with-cpp \
            -I kernel/include -I kernel/arch/arm64/boot/dts/qcom \
            "$BOARD_DTS" -o board-dtb/j4-board.dts
          dtc -I dts -O dtb -o board-dtb/j4-board.dtb board-dtb/j4-board.dts \
            2> board-dtb/dtc.log || {
              cat board-dtb/dtc.log
              echo "::error title=Board DTB failed::cannot make a device-ready boot image without the J4+ DTB"
              exit 1
            }
          python3 "$J4_DIR/qcdt.py" --dtb board-dtb/j4-board.dtb \
            --out board-dtb/j4-qcdt.img --page-size 4096 \
            | tee board-dtb/qcdt-report.txt
          echo "BOARD_DTB=$PWD/board-dtb/j4-board.dtb" >> "$GITHUB_ENV"
          echo "QCDT_IMAGE=$PWD/board-dtb/j4-qcdt.img" >> "$GITHUB_ENV"
          echo "DTB_HANDOFF=QCDT-after-ramdisk plus separate Medusa-layout raw-FDT-appended diagnostic" >> "$GITHUB_ENV"

      - name: Fetch the donor boot image
        run: |
          set -euo pipefail
          mkdir -p donor
          curl -fL --retry 3 --retry-delay 5 -o donor/boot.img "$DONOR_URL"
          echo "$DONOR_SHA256  donor/boot.img" | sha256sum -c -
          ./repack-boot inspect donor/boot.img | tee donor-report.txt
          # The donor must be an Android v0 image with a pmOS ramdisk that
          # already knows how to find the installed rootfs.
          grep -q 'ANDROID' donor-report.txt || true
          grep -q 'ramdisk' donor-report.txt
          echo "donor accepted"

      - name: Build kernel
        if: env.J4_DRY_RUN != 'true'
        run: |
          set -euo pipefail
          export J4_K510_JOBS="$(nproc)"
          export J4_K510_ALLOW_AUDIT_FAIL="$( [ "$allow_audit_fail" = true ] && echo 1 || echo 0 )"
          export J4_K510_CROSS_COMPILE="$CROSS_PREFIX"
          export J4_K510_FRAGMENT="${FRAGMENT:-}"
          export J4_K510_BOARD_DTB="${BOARD_DTB:-}"
          if [ "${{ inputs.config_only }}" = "true" ]; then
            export J4_K510_CONFIG_ONLY=1
            echo "config-only run: no compile"
          fi
          tc_dir=$PWD/tc
          [ -n "$TOOLCHAIN_URL" ] || tc_dir=/usr
          set +e
          "$J4_DIR/build-kernel.sh" kernel "$PWD/out" "$tc_dir" "$DEFCONFIG" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # Say where it broke and why, on the run itself. Without this the
            # only evidence is a step that went red.
            phase=$(grep -oE '^=== [a-z][a-z ()-]*' build.log | tail -1 || true)
            echo "::error title=Kernel build failed${phase:+ at '$phase'}::build-kernel.sh exited $rc"

            # A config audit failure is the most informative case: name the
            # symbols. They are printed as "FAIL CONFIG_X want=.. got=..".
            if grep -q 'required symbol(s) missing' build.log; then
              echo "::error title=Config audit blocked the build::the kernel compiled, but systemd would refuse to boot with it"
              grep -E '^  FAIL ' build.log | head -10 | while IFS= read -r line; do
                echo "::error title=Missing symbol::$line"
              done
            fi

            grep -m 5 -E 'error:|Error [0-9]+|fatal:|No rule to make|undefined reference' build.log \
              | while IFS= read -r line; do
                  echo "::error title=First error::$line"
                done
            for marker in '=== audit (hard)' '=== audit (systemd)' '=== collect' '=== configure' '=== build'; do
              grep -qFx "$marker" build.log && echo "reached: $marker"
            done
            # Which phase actually failed, spelled out.
            if grep -q 'FAILED PHASE:' build.log; then
              grep -m 3 'FAILED PHASE:' build.log | while IFS= read -r line; do
                echo "::error title=Phase failed::$line"
              done
            fi
            # dtc/cpp messages for the board device tree.
            if [ -s out/dtc.log ]; then
              head -n 12 out/dtc.log | while IFS= read -r line; do
                echo "::error title=dtc::$line"
              done
            fi
            echo "--- last 30 lines ---"
            tail -n 30 build.log
            exit 1
          fi

      - name: Repack the donor with the new kernel
        if: env.J4_DRY_RUN != 'true'
        run: |
          set -euo pipefail
          test -s "${QCDT_IMAGE:?required Qualcomm QCDT table missing}"
          ./repack-boot repack donor/boot.img \
            --kernel-new out/kernel.payload \
            --dt "$QCDT_IMAGE" \
            --out boot-k510.img \
            --cmdline-append 'systemd.unified_cgroup_hierarchy=1' \
            | tee repack-report.txt
          ./repack-boot inspect boot-k510.img | tee boot-k510-report.txt
          grep -q 'qcdt.*v3' boot-k510-report.txt
          # Keep the proven QCDT image, and also produce a separate diagnostic
          # using the Medusa image's observed layout: a mainline-compatible FDT
          # appended to the kernel payload, with the boot-header dt_size zero.
          ./repack-boot repack donor/boot.img \
            --kernel-new out/kernel.payload \
            --append-dtb "${BOARD_DTB:?compiled mainline DTB missing}" \
            --out boot-k510-appended-dtb.img \
            --cmdline-append 'systemd.unified_cgroup_hierarchy=1' \
            | tee appended-dtb-repack-report.txt
          ./repack-boot inspect boot-k510-appended-dtb.img \
            | tee boot-k510-appended-dtb-report.txt
          python3 - <<'PY'
          from pathlib import Path
          import struct
          image = Path('boot-k510-appended-dtb.img').read_bytes()
          page, kernel_size, dt_size = (struct.unpack_from('<I', image, off)[0]
                                        for off in (36, 8, 40))
          dtb = Path('board-dtb/j4-board.dtb').read_bytes()
          kernel = image[page:page + kernel_size]
          assert dt_size == 0, f'expected dt_size=0, got {dt_size}'
          assert kernel.endswith(dtb), 'mainline FDT is not appended to kernel payload'
          print(f'validated raw-FDT handoff: {len(dtb)} FDT bytes in kernel_size; dt_size=0')
          PY
          # Retain the donor header/ramdisk in each output; checksums let the
          # two BOOT-only variants be distinguished and rolled back safely.
          sha256sum boot-k510.img > boot-k510.img.sha256
          sha256sum boot-k510-appended-dtb.img > boot-k510-appended-dtb.img.sha256
          cat boot-k510.img.sha256 boot-k510-appended-dtb.img.sha256

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## J4+ 5.10 bring-up'
            echo
            echo "- branch: \`${{ github.ref_name }}\` / run \`${{ github.run_id }}\`"
            echo "- tree: \`$KERNEL_URL\` @ \`$KERNEL_BRANCH\`"
            echo "- defconfig: \`${DEFCONFIG:-<undecided>}\`"
            echo "- fragment: \`${FRAGMENT:-none}\`"
            echo "- DT handoff: \`${DTB_HANDOFF:-missing}\`"
            echo "- dry run: \`$J4_DRY_RUN\`"
            echo
            echo '<details><summary>tree validation</summary>'
            echo
            echo '```'
            cat tree-report.txt 2>/dev/null || echo '(step did not run)'
            echo '```'
            echo '</details>'
            if [ -f selftest-report.txt ]; then
              echo '<details><summary>packing self-test (passed)</summary>'
              echo
              echo '```'
              cat selftest-report.txt
              echo '```'
              echo '</details>'
            fi
            if [ -f donor-report.txt ]; then
              echo '<details><summary>donor</summary>'
              echo
              echo '```'
              cat donor-report.txt
              echo '```'
              echo '</details>'
            fi
            if [ -f out/config-audit.json ]; then
              echo '<details><summary>config audit</summary>'
              echo
              echo '```json'
              cat out/config-audit.json
              echo '```'
              echo '</details>'
            fi
            if [ -f boot-k510-report.txt ]; then
              echo '<details><summary>QCDT boot image</summary>'
              echo
              echo '```'
              cat boot-k510-report.txt
              echo '```'
              echo '</details>'
            fi
            if [ -f boot-k510-appended-dtb-report.txt ]; then
              echo '<details><summary>Medusa-layout diagnostic boot image</summary>'
              echo
              echo '```'
              cat boot-k510-appended-dtb-report.txt
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j4-k510-${{ github.run_id }}
          path: |
            selftest-report.txt
            pins-report.txt
            fragment-report.txt
            tree-report.txt
            donor-report.txt
            boot-k510.img
            boot-k510.img.sha256
            boot-k510-report.txt
            boot-k510-appended-dtb.img
            boot-k510-appended-dtb.img.sha256
            boot-k510-appended-dtb-report.txt
            appended-dtb-repack-report.txt
            repack-report.txt
            build.log
            out/config.full
            out/config-audit.json
            out/kernel.payload
            board-dtb/
          if-no-files-found: warn
          retention-days: 14
