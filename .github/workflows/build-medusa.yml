name: Build postmarketOS J4+ SM-J415F (USB debug)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j4primelte-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GIT_TERMINAL_PROMPT: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python for pmbootstrap
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          mkdir -p artifacts/logs
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex git curl ca-certificates python2 \
            libssl-dev libelf-dev libncurses5 libncurses-dev zlib1g-dev \
            lib32z1 lib32stdc++6 cpio rsync xz-utils file kmod kpartx \
            qemu-user-static binfmt-support e2fsprogs sudo util-linux
          df -h

      - name: Check scripts and kernel cache tests
        run: |
          bash -n ci/j4primelte/build-kernel.sh ci/j4primelte/prepare-pmos.sh ci/j4primelte/build-pmos.sh
          python3 -m compileall -q ci/j4primelte
          python3 ci/j4primelte/test-kernel-cache.py
          python3 ci/j4primelte/test-kernel-bt.py
          python3 ci/j4primelte/test-wifi-setup.py
          python3 ci/j4primelte/test-j4-audio.py

      - name: Preflight pmbootstrap before the long kernel compile
        run: bash ci/j4primelte/prepare-pmos.sh 2>&1 | tee artifacts/logs/preflight.log

      - name: Calculate kernel-only cache key
        id: kernel_key
        run: echo "value=$(python3 ci/j4primelte/kernel-cache.py key)" >> "$GITHUB_OUTPUT"

      - name: Restore successful kernel inputs
        id: kernel_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: artifacts/kernel-cache
          key: j4-kernel-v1-ubuntu22-${{ steps.kernel_key.outputs.value }}

      - name: Build the pinned J4+ kernel with the pmOS configuration
        if: steps.kernel_cache.outputs.cache-hit != 'true'
        run: bash ci/j4primelte/build-kernel.sh 2>&1 | tee artifacts/logs/kernel-build.log

      - name: Record compiler outputs and provenance
        if: steps.kernel_cache.outputs.cache-hit != 'true'
        run: python3 ci/j4primelte/kernel-cache.py capture

      - name: Verify and stage kernel inputs
        run: python3 ci/j4primelte/kernel-cache.py restore

      - name: Save successful kernel before image packaging
        if: steps.kernel_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: artifacts/kernel-cache
          key: j4-kernel-v1-ubuntu22-${{ steps.kernel_key.outputs.value }}

      - name: Upload compiler outputs (not flashable images)
        uses: actions/upload-artifact@v4
        with:
          name: j4primelte-kernel-inputs-${{ github.run_number }}
          path: artifacts/kernel-cache/
          if-no-files-found: error
          retention-days: 14

      - name: Build OpenRC postmarketOS and USB debug images
        run: bash ci/j4primelte/build-pmos.sh 2>&1 | tee artifacts/logs/pmos-build.log

      - name: Collect diagnostics even on failure
        if: always()
        run: |
          mkdir -p artifacts/logs
          if [ -f "$HOME/j4-pmos-work/log.txt" ]; then
            sudo cp "$HOME/j4-pmos-work/log.txt" artifacts/logs/pmbootstrap.log
          fi
          if [ -f "$HOME/j4-kernel/out/.config" ]; then
            cp "$HOME/j4-kernel/out/.config" artifacts/logs/kernel.config
          fi
          git diff --stat > artifacts/logs/worktree.txt
          sudo chown -R "$(id -u):$(id -g)" artifacts
          df -h > artifacts/logs/disk-space.txt

      - name: Upload images (only after validation)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-j4primelte-SM-J415F-usb-debug-${{ github.run_number }}
          path: artifacts/images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build logs and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j4primelte-build-logs-${{ github.run_number }}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
