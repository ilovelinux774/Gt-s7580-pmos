name: Build postmarketOS for GT-S7580 (samsung-kylepro)

on:
  push:
  workflow_dispatch:

jobs:
  build-pmos:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get purge -y '^mono-*' '^llvm-*' '^php*' '^mysql-*' '^postgresql-*' \
            'google-chrome-*' 'microsoft-edge-*' firefox 'powershell' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip openssl sudo util-linux \
            qemu-user-static binfmt-support ca-certificates wget curl file tar gzip xz-utils unzip \
            android-sdk-libsparse-utils

      - name: Clone pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/pmbootstrap
          echo "$HOME/pmbootstrap" >> $GITHUB_PATH
          python3 ~/pmbootstrap/pmbootstrap.py --version

      - name: Patch pmbootstrap for kernel 3.4 ext4 rootfs compatibility
        run: |
          # GT-S7580 runs an extremely old kernel (3.4). Modern e2fsprogs enables
          # metadata_csum, metadata_csum_seed, and meta_bg by default. These cause
          # kernel panics or mount failures on downstream. We must disable them.
          python3 - << 'PATCH'
          from pathlib import Path
          p = Path.home() / "pmbootstrap/pmb/install/format.py"
          src = p.read_text()
          old = r'''        if device_category.allows_downstream_ports():
                      # Some downstream kernels don't support metadata_csum (#1364).
                      # When changing the options of mkfs.ext4, also change them in the
                      # recovery zip code (see 'grep -r mkfs\.ext4')!
                      category_opts = ["-O", "^metadata_csum"]
                  else:
                      category_opts = []'''
          new = '''        # samsung-kylepro: kernel 3.4 cannot mount ext4 with metadata_csum,
                  # metadata_csum_seed, or meta_bg. Disable for ALL device categories.
                  category_opts = ["-O", "^metadata_csum,^metadata_csum_seed,^meta_bg"]'''
          if old not in src:
              raise SystemExit("ERROR: pmbootstrap format.py changed upstream - update this patch")
          p.write_text(src.replace(old, new))
          print("pmbootstrap patched: ext4 rootfs will be safe for GT-S7580 kernel")
          PATCH

      - name: Patch pmbootstrap chroot env (GOGC=off for qemu Go binaries)
        run: |
          # mkinitfs is a Go binary that runs for armv7 under qemu-user.
          # Go's concurrent garbage collector crashes under qemu emulation
          # ("fatal error: found pointer to free object"). pmbootstrap runs
          # chroot commands with 'sudo env -i' (host env stripped), so inject
          # GOGC=off into the default chroot environment.
          python3 - << 'PATCH'
          from pathlib import Path
          p = Path.home() / "pmbootstrap/pmb/chroot/run.py"
          src = p.read_text()
          old = '        "CHARSET": "UTF-8",'
          new = '        "GOGC": "off",\n        "CHARSET": "UTF-8",'
          if old not in src:
              raise SystemExit("ERROR: pmbootstrap run.py changed upstream - update this patch")
          p.write_text(src.replace(old, new))
          print("pmbootstrap patched: GOGC=off in chroot environment")
          PATCH

      - name: Initialize pmbootstrap
        run: |
          yes "" | python3 ~/pmbootstrap/pmbootstrap.py init 2>&1 || true
          python3 ~/pmbootstrap/pmbootstrap.py config device || true
          python3 ~/pmbootstrap/pmbootstrap.py config aports || true

          # Use samsung-kylepro which is already in pmOS testing!
          # Add python3 and busybox-extras (for telnetd).
          python3 ~/pmbootstrap/pmbootstrap.py config device samsung-kylepro
          python3 ~/pmbootstrap/pmbootstrap.py config extra_packages python3,busybox-extras
          python3 ~/pmbootstrap/pmbootstrap.py config ui console
          python3 ~/pmbootstrap/pmbootstrap.py config user test
          python3 ~/pmbootstrap/pmbootstrap.py config hostname s7580
          python3 ~/pmbootstrap/pmbootstrap.py config timezone UTC
          python3 ~/pmbootstrap/pmbootstrap.py config locale C.UTF-8

      - name: Inject Rootfs Telnetd (root shell on port 23, OpenRC + systemd)
        run: |
          set -euo pipefail
          PMAPORTS=$(python3 ~/pmbootstrap/pmbootstrap.py config aports)
          DEVICE_DIR="$PMAPORTS/device/testing/device-samsung-kylepro"
          test -d "$DEVICE_DIR" || { echo "ERROR: device dir not found: $DEVICE_DIR"; exit 1; }

          # OpenRC service script (runs at boot via /etc/local.d if OpenRC is used)
          cat > "$DEVICE_DIR/telnetd.start" << 'TELNET'
          #!/bin/sh
          # Drop directly to root shell on port 23
          /usr/sbin/telnetd -l /bin/sh -p 23
          TELNET

          # systemd unit (pmOS edge defaults to systemd; enable via multi-user.target.wants)
          cat > "$DEVICE_DIR/telnetd.service" << 'UNIT'
          [Unit]
          Description=Root telnet shell on port 23 (debug access)
          After=network.target

          [Service]
          Type=forking
          ExecStart=/usr/sbin/telnetd -l /bin/sh -p 23
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          UNIT

          chmod 755 "$DEVICE_DIR/telnetd.start"
          chmod 644 "$DEVICE_DIR/telnetd.service"

          # Patch the APKBUILD with a robust python editor (the old sed-based
          # patch produced `telnetd.startdeviceinfo"` — two source files glued
          # together — which made `abuild checksum` fail).
          python3 - "$DEVICE_DIR/APKBUILD" << 'PATCH'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          src = p.read_text()

          old_source = 'source="deviceinfo"'
          new_source = (
              'source="\n'
              '\ttelnetd.start\n'
              '\ttelnetd.service\n'
              '\tdeviceinfo"'
          )
          if old_source not in src:
              raise SystemExit("ERROR: source= line in APKBUILD does not match expected form")
          src = src.replace(old_source, new_source)

          old_package = (
              "package() {\n"
              "\tdevicepkg_package $startdir $pkgname\n"
              "}"
          )
          new_package = (
              "package() {\n"
              "\tdevicepkg_package $startdir $pkgname\n"
              "\n"
              '\tinstall -Dm755 "$srcdir"/telnetd.start -t "$pkgdir"/etc/local.d\n'
              '\tinstall -Dm644 "$srcdir"/telnetd.service -t "$pkgdir"/usr/lib/systemd/system\n'
              '\tinstall -d "$pkgdir"/usr/lib/systemd/system/multi-user.target.wants\n'
              '\tln -s ../telnetd.service "$pkgdir"/usr/lib/systemd/system/multi-user.target.wants/telnetd.service\n'
              "}"
          )
          if old_package not in src:
              raise SystemExit("ERROR: package() block in APKBUILD does not match expected form")
          src = src.replace(old_package, new_package)

          p.write_text(src)
          print("APKBUILD patched: source files + install lines added")
          PATCH

          echo "=== Patched APKBUILD ==="
          cat "$DEVICE_DIR/APKBUILD"

          # Regenerate sha512sums for the new source files
          python3 ~/pmbootstrap/pmbootstrap.py checksum device-samsung-kylepro
          echo "checksums updated OK"

      - name: Disable initramfs-extra (required for --single-partition image)
        run: |
          set -euo pipefail
          PMAPORTS=$(python3 ~/pmbootstrap/pmbootstrap.py config aports)
          DEVICE_INFO="$PMAPORTS/device/testing/device-samsung-kylepro/deviceinfo"
          test -f "$DEVICE_INFO" || { echo "ERROR: deviceinfo not found"; exit 1; }
          # pmbootstrap refuses --single-partition when initramfs-extra is enabled.
          # NOTE: pmbootstrap parses deviceinfo values as raw strings, so setting
          # ="false" is still truthy — the variable must be UNSET to disable it
          # (it then falls back to the default of False).
          sed -i '/^deviceinfo_create_initfs_extra=/d' "$DEVICE_INFO"
          echo "=== deviceinfo initfs setting now (should print nothing): ==="
          grep create_initfs_extra "$DEVICE_INFO" && { echo "ERROR: initfs-extra still enabled"; exit 1; } || echo "initramfs-extra disabled"
          # deviceinfo is a source file of the package -> refresh its checksum
          python3 ~/pmbootstrap/pmbootstrap.py checksum device-samsung-kylepro

      - name: Build postmarketOS (Single Partition)
        run: |
          echo "Starting build at $(date)"
          set -o pipefail

          # --single-partition: generate a single flat ext4 image with no GPT/
          #   partition table (easy to flash via TWRP -> Flash image to system).
          # --no-sparse: do NOT wrap it in Android sparse format (that is only
          #   for Odin/heimdall; TWRP wants the raw ext4 image).
          # pipefail ensures a pmbootstrap failure fails the step even through tee.
          # (GOGC=off for the qemu-emulated mkinitfs is injected via the
          # "Patch pmbootstrap chroot env" step above.)
          set -o pipefail
          if ! echo -e "test\ntest" | python3 ~/pmbootstrap/pmbootstrap.py install --single-partition --no-sparse 2>&1 | tee build.log; then
            echo "=== BUILD FAILED ==="
            LOGFILE=~/.local/var/pmbootstrap/log.txt
            if [ -f "$LOGFILE" ]; then
              echo "=== raw pmbootstrap log file (last 300 lines) ==="
              tail -300 "$LOGFILE"
            fi
            # The rootfs image may still exist from a previous/failed run;
            # clean stale chroots so a retry starts from a consistent state.
            python3 ~/pmbootstrap/pmbootstrap.py zap 2>&1 | tail -5 || true
            exit 1
          fi

      - name: Export and Verify Images
        run: |
          set -euo pipefail
          mkdir -p ~/pmos-export
          # --no-install: skip rebuilding the initramfs at export time.
          # mkinitfs already ran inside 'pmbootstrap install' with the
          # final UUIDs; the post-install remount in export's autoinstall
          # path fails under CI ("chroot not initialized" -> mkinitfs exit 1).
          python3 ~/pmbootstrap/pmbootstrap.py export --no-install ~/pmos-export

          # export() creates convenience symlinks pointing into the chroots.
          # Dereference them into real files so the artifact upload gets the
          # actual binaries.
          cd ~/pmos-export
          for l in *; do
            if [ -L "$l" ]; then
              target="$(readlink -f "$l")"
              rm "$l"
              cp "$target" "$l"
            fi
          done
          [ -d dtbs ] && find dtbs -type l -exec sh -c 't=$(readlink -f "$1"); rm "$1"; cp "$t" "$1"' _ {} \; || true

          # Give the rootfs a TWRP-friendly name (it is a raw ext4 filesystem,
          # no partition table) and drop a flashing guide next to it.
          mv samsung-kylepro.img rootfs.img
          cat > FLASHING.txt << 'EOF'
          postmarketOS for Samsung GT-S7580 (samsung-kylepro) — TWRP flashing
          =====================================================================

          Files:
            boot.img    Android boot image (kernel + initramfs) -> flash to BOOT
            rootfs.img  Raw ext4 root filesystem (NO partition table) -> flash to SYSTEM
            vmlinuz     Raw kernel (not needed for TWRP; boot.img already contains it)
            dtbs/       Device tree blobs (not needed; appended to kernel)

          Steps in TWRP:
            1. Boot to TWRP (power + vol-up / vol-down as usual).
            2. Push the files to /tmp or external SD (adb push boot.img rootfs.img /sdcard/).
            3. Wipe -> Advanced Wipe -> tick System (do NOT use the default wipe,
               it expects the old Android/fsck layout; format System as ext2/ext4 if asked).
            4. Install -> Install Image -> choose boot.img -> flash to "Boot".
            5. Install -> Install Image -> choose rootfs.img -> flash to "System".
            6. Reboot.

          First boot:
            - serial console on the UART getty (ttyS2 @115200) if you have a dock.
            - a root shell is also listening on telnet port 23 (debug only!).
            - user "test" / password "test".

          NOTE: rootfs.img is a flat ext4 filesystem for the whole SYSTEM
          partition. It has NO GPT/partition table and is NOT sparse, so TWRP
          can write it directly with "dd"-style image flashing.
          EOF
          # strip the leading indentation added by the heredoc in YAML
          sed -i 's/^          //' FLASHING.txt

          echo "=== Exported files ==="
          ls -la ~/pmos-export/

          echo "Rootfs image:"
          file -b rootfs.img

          echo "Verifying there is NO partition table (must be bare ext4)..."
          # ext4 magic must be at offset 0x438...
          od -An -tx1 -j 1080 -N 2 rootfs.img | grep -qi "53 ef" \
            || { echo "ERROR: ext4 magic not found"; exit 1; }
          # ...and the GPT signature at sector 1 must be absent (no 'EFI PART').
          if od -An -tx1 -j 512 -N 8 rootfs.img | grep -qi "45 46 49 20"; then
            echo "ERROR: GPT signature present — image has a partition table!"
            exit 1
          fi
          echo "OK: bare ext4 filesystem, no GPT/UEFI, no subpartitions."

          echo "Verifying ext4 features are safe for the 3.4 kernel..."
          sudo tune2fs -l rootfs.img | grep "Filesystem features" | tee /tmp/features
          for bad in metadata_csum metadata_csum_seed meta_bg; do
            if grep -qw "$bad" /tmp/features; then
              echo "ERROR: feature '$bad' is set! The old kernel will panic."
              exit 1
            fi
          done
          echo "Rootfs is fully prepared and safe!"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-kylepro
          path: /home/runner/pmos-export/
          retention-days: 14
